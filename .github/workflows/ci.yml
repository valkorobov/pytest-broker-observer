name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.19"

jobs:
  core:
    name: Core / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --all-groups --all-extras
      - name: Run unit tests with coverage
        id: unit_tests
        run: uv run --locked coverage run -m pytest tests -m 'not integration' --junitxml=core-results.xml -o junit_family=xunit1
      - name: Generate unit coverage reports
        if: ${{ !cancelled() && (steps.unit_tests.outcome == 'success' || steps.unit_tests.outcome == 'failure') }}
        run: |
          # Export diagnostics even below the threshold; the next step enforces it.
          uv run --locked coverage xml --fail-under=0
          uv run --locked coverage html --fail-under=0
          uv run --locked coverage json --fail-under=0
      - name: Enforce minimum 80% unit coverage
        if: ${{ !cancelled() && (steps.unit_tests.outcome == 'success' || steps.unit_tests.outcome == 'failure') }}
        run: uv run --locked coverage report
      - name: Upload unit coverage reports
        if: ${{ !cancelled() && (steps.unit_tests.outcome == 'success' || steps.unit_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage-python-${{ matrix.python }}
          path: artifacts/coverage/
          if-no-files-found: error
          retention-days: 7
      - name: Run pytest and Allure usage examples
        run: uv run --locked pytest examples/pytest examples/allure -m 'not integration'

  allure-example:
    name: Allure example / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --all-groups --all-extras
      - name: Run Allure examples
        id: allure_tests
        run: uv run pytest -c pyproject.toml examples/allure -m 'not integration' --alluredir=artifacts/allure-results --clean-alluredir -v
      - name: Generate standalone Allure report
        id: generate_report
        if: ${{ !cancelled() && (steps.allure_tests.outcome == 'success' || steps.allure_tests.outcome == 'failure') }}
        run: npx --yes allure@3.22.1 awesome artifacts/allure-results --single-file --output artifacts/allure-report --report-language en
      - name: Upload Allure report
        if: ${{ !cancelled() && (steps.generate_report.outcome == 'success' || steps.generate_report.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-example-report
          path: artifacts/allure-report/
          if-no-files-found: warn
          retention-days: 7

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run pre-commit run --all-files
      - run: uv run python tools/check_docstrings.py
      - run: uv run pyright
      - run: uv run pytest -n 2 -m 'not integration'

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --all-groups --all-extras
      - run: uv build --no-sources
      - run: uv run twine check dist/*
      - name: Clean wheel import without optional dependencies
        run: |
          python -m venv /tmp/observer-wheel
          /tmp/observer-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/observer-wheel/bin/python -I - <<'PY'
          import importlib.util
          import importlib.resources
          import sys
          import event_observer
          assert importlib.resources.files(event_observer).joinpath("py.typed").is_file()
          for name in ("confluent_kafka", "aio_pika", "aiormq", "pika", "redis", "google", "pytest", "allure", "opentelemetry"):
              assert name not in sys.modules
              assert importlib.util.find_spec(name) is None
          import asyncio
          from event_observer.sync import SyncEventObserver
          from event_observer.testing import FakeTransport
          def forbidden(*args, **kwargs):
              raise AssertionError("blocking observation must not create an asyncio runtime")
          asyncio.new_event_loop = forbidden
          asyncio.run = forbidden
          asyncio.Runner = forbidden
          adapter = FakeTransport()
          with SyncEventObserver(transport=adapter).watch(source="events") as watcher:
              mark = watcher.mark()
              adapter.publish(b"completed")
              assert watcher.wait_for(lambda value: value == b"completed", since=mark, timeout=1) == b"completed"
          PY
      - name: Clean source distribution installation
        run: |
          python -m venv /tmp/observer-sdist
          /tmp/observer-sdist/bin/python -m pip install --no-deps dist/*.tar.gz
          /tmp/observer-sdist/bin/python -I -c 'from event_observer import EventObserver, SyncEventObserver'
      - name: Pure synchronous pytest without pytest-asyncio
        run: |
          /tmp/observer-wheel/bin/python -m pip install 'pytest>=8.3,<10'
          cat > /tmp/test_observer_minimal.py <<'PY'
          from event_observer import SyncEventObserver
          from event_observer.testing import FakeTransport

          def test_sync_observer():
              adapter = FakeTransport()
              with SyncEventObserver(transport=adapter).watch(source="events") as watcher:
                  adapter.publish(b"hello")
                  assert watcher.wait_for(lambda payload: payload == b"hello", timeout=1) == b"hello"
          PY
          /tmp/observer-wheel/bin/python -I -m pytest -c /dev/null /tmp/test_observer_minimal.py -q

  kafka:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAFKA_PORT: "9092"
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --all-groups --all-extras
      - name: Start Kafka
        run: docker compose up --detach --wait --wait-timeout 120
      - run: uv run pytest -c pyproject.toml tests/integration/test_kafka*.py tests/integration/test_sync_contracts.py examples/pytest/test_kafka.py -v --junitxml=kafka-results.xml -o junit_family=xunit1
      - name: Run Kafka Allure examples
        id: kafka_allure_tests
        run: uv run pytest -c pyproject.toml examples/allure/test_kafka.py -m integration --alluredir=artifacts/allure-kafka-results --clean-alluredir -v
      - name: Generate standalone Kafka Allure report
        id: generate_kafka_report
        if: ${{ !cancelled() && (steps.kafka_allure_tests.outcome == 'success' || steps.kafka_allure_tests.outcome == 'failure') }}
        run: npx --yes allure@3.22.1 awesome artifacts/allure-kafka-results --single-file --output artifacts/allure-kafka-report --report-language en
      - name: Upload Kafka Allure report
        if: ${{ !cancelled() && (steps.generate_kafka_report.outcome == 'success' || steps.generate_kafka_report.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-kafka-example-report
          path: artifacts/allure-kafka-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Kafka logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 kafka
      - name: Stop Kafka
        if: always()
        run: docker compose down --volumes

  rabbitmq:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RABBITMQ_URL: amqp://observer:observer@127.0.0.1:5672/
      RABBITMQ_MANAGEMENT_URL: http://127.0.0.1:15672
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --all-groups --all-extras
      - name: Start RabbitMQ
        run: docker compose --profile rabbitmq up --detach --wait --wait-timeout 120 rabbitmq
      - name: Run RabbitMQ contracts and pytest examples
        run: uv run pytest -c pyproject.toml tests/integration/test_rabbitmq*.py tests/integration/test_sync_contracts.py examples/pytest/test_rabbitmq.py -v --junitxml=rabbitmq-results.xml -o junit_family=xunit1
      - name: Run RabbitMQ Allure examples
        id: rabbitmq_allure_tests
        run: uv run pytest -c pyproject.toml examples/allure/test_rabbitmq.py -m integration --alluredir=artifacts/allure-rabbitmq-results --clean-alluredir -v
      - name: Generate standalone RabbitMQ Allure report
        id: generate_rabbitmq_report
        if: ${{ !cancelled() && (steps.rabbitmq_allure_tests.outcome == 'success' || steps.rabbitmq_allure_tests.outcome == 'failure') }}
        run: npx --yes allure@3.22.1 awesome artifacts/allure-rabbitmq-results --single-file --output artifacts/allure-rabbitmq-report --report-language en
      - name: Upload RabbitMQ Allure report
        if: ${{ !cancelled() && (steps.generate_rabbitmq_report.outcome == 'success' || steps.generate_rabbitmq_report.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-rabbitmq-example-report
          path: artifacts/allure-rabbitmq-report/
          if-no-files-found: warn
          retention-days: 7
      - name: RabbitMQ logs on failure
        if: failure()
        run: docker compose --profile rabbitmq logs --no-color --tail 200 rabbitmq
      - name: Stop RabbitMQ
        if: always()
        run: docker compose --profile rabbitmq down --volumes

  redis-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDIS_URL: redis://:observer@127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --all-groups --all-extras
      - name: Start Redis Streams
        run: docker compose --profile redis up --detach --wait --wait-timeout 120 redis
      - name: Run Redis Streams contracts and pytest examples
        run: uv run pytest -c pyproject.toml tests/integration/test_redis_streams*.py tests/integration/test_sync_contracts.py examples/pytest/test_redis_streams.py -v --junitxml=redis-results.xml -o junit_family=xunit1
      - name: Run Redis Streams Allure examples
        id: redis_allure_tests
        run: uv run pytest -c pyproject.toml examples/allure/test_redis_streams.py -m integration --alluredir=artifacts/allure-redis-results --clean-alluredir -v
      - name: Generate standalone Redis Streams Allure report
        id: generate_redis_report
        if: ${{ !cancelled() && (steps.redis_allure_tests.outcome == 'success' || steps.redis_allure_tests.outcome == 'failure') }}
        run: npx --yes allure@3.22.1 awesome artifacts/allure-redis-results --single-file --output artifacts/allure-redis-report --report-language en
      - name: Upload Redis Streams Allure report
        if: ${{ !cancelled() && (steps.generate_redis_report.outcome == 'success' || steps.generate_redis_report.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-redis-example-report
          path: artifacts/allure-redis-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Redis Streams logs on failure
        if: failure()
        run: docker compose --profile redis logs --no-color --tail 200 redis
      - name: Stop Redis Streams
        if: always()
        run: docker compose --profile redis down --volumes
