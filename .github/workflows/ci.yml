name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  UV_VERSION: "0.12.19"

jobs:
  core:
    name: Core / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --all-groups --all-extras
      - name: Run unit tests with coverage
        id: unit_tests
        run: uv run --locked coverage run -m pytest tests -m 'not integration' --junitxml=core-results.xml -o junit_family=xunit1
      - name: Generate unit coverage reports
        if: ${{ !cancelled() && (steps.unit_tests.outcome == 'success' || steps.unit_tests.outcome == 'failure') }}
        run: |
          # Export diagnostics even below the threshold; the next step enforces it.
          uv run --locked coverage xml --fail-under=0
          uv run --locked coverage html --fail-under=0
          uv run --locked coverage json --fail-under=0
      - name: Enforce minimum 80% unit coverage
        if: ${{ !cancelled() && (steps.unit_tests.outcome == 'success' || steps.unit_tests.outcome == 'failure') }}
        run: uv run --locked coverage report
      - name: Upload unit coverage reports
        if: ${{ !cancelled() && (steps.unit_tests.outcome == 'success' || steps.unit_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage-python-${{ matrix.python }}
          path: artifacts/coverage/
          if-no-files-found: error
          retention-days: 7
      - name: Run pytest and Allure usage examples
        run: uv run --locked pytest examples/pytest examples/allure -m 'not integration'

  allure-example:
    name: Allure example / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --all-groups --all-extras
      - name: Run Allure examples
        id: allure_tests
        run: uv run pytest -c pyproject.toml examples/allure -m 'not integration' --alluredir=artifacts/allure-results --clean-alluredir -v
      - name: Generate standalone Allure report
        id: generate_report
        if: ${{ !cancelled() && (steps.allure_tests.outcome == 'success' || steps.allure_tests.outcome == 'failure') }}
        run: npx --yes allure@3.22.1 awesome artifacts/allure-results --single-file --output artifacts/allure-report --report-language en
      - name: Upload Allure report
        if: ${{ !cancelled() && (steps.generate_report.outcome == 'success' || steps.generate_report.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-example-report
          path: artifacts/allure-report/
          if-no-files-found: warn
          retention-days: 7

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run pre-commit run --all-files
      - run: uv run python tools/check_docstrings.py
      - name: Validate complete SPEC traceability inventory
        run: uv run --locked python tools/check_traceability.py
      - run: uv run pyright
      - run: uv run pytest -n 2 -m 'not integration'

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --all-groups --all-extras
      - name: Validate release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          expected_tag = f"v{project['version']}"
          if project["name"] != "pytest-broker-observer" or os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(f"Release tag must match the distribution version: {expected_tag}")
          PY
      - run: uv build --no-sources
      - name: Verify source and distribution license identity
        run: uv run --locked python tools/check_release_identity.py
      - run: uv run twine check dist/*
      - name: Clean wheel import without optional dependencies
        run: |
          python -m venv /tmp/observer-wheel
          /tmp/observer-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/observer-wheel/bin/python -I - <<'PY'
          import importlib.util
          import importlib.resources
          import sys
          import event_observer
          assert importlib.resources.files(event_observer).joinpath("py.typed").is_file()
          for name in ("confluent_kafka", "aio_pika", "aiormq", "pika", "redis", "google", "pytest", "allure", "opentelemetry"):
              assert name not in sys.modules
              assert importlib.util.find_spec(name) is None
          import asyncio
          from event_observer.sync import SyncEventObserver
          from event_observer.testing import FakeTransport
          def forbidden(*args, **kwargs):
              raise AssertionError("blocking observation must not create an asyncio runtime")
          asyncio.new_event_loop = forbidden
          asyncio.run = forbidden
          asyncio.Runner = forbidden
          adapter = FakeTransport()
          with SyncEventObserver(transport=adapter).watch(source="events") as watcher:
              mark = watcher.mark()
              adapter.publish(b"completed")
              assert watcher.wait_for(lambda value: value == b"completed", since=mark, timeout=1) == b"completed"
          PY
      - name: Clean source distribution installation
        run: |
          python -m venv /tmp/observer-sdist
          /tmp/observer-sdist/bin/python -m pip install --no-deps dist/*.tar.gz
          /tmp/observer-sdist/bin/python -I -c 'from event_observer import EventObserver, SyncEventObserver'
      - name: Check installed public consumer typing for both artifacts
        run: |
          uv run --locked python tools/check_installed_typing.py --python /tmp/observer-wheel/bin/python
          uv run --locked python tools/check_installed_typing.py --python /tmp/observer-sdist/bin/python
      - name: Installed-wheel factory fixtures with pytest only
        run: |
          /tmp/observer-wheel/bin/python -m pip install 'pytest>=8.3,<10'
          cat > /tmp/test_observer_minimal.py <<'PY'
          import asyncio
          import importlib.util
          import socket
          import sys
          import threading
          import pytest
          from event_observer.testing import FakeTransport
          from event_observer.transports.kafka import KafkaConfig
          from event_observer.transports.rabbitmq import RabbitMQConfig
          from event_observer.transports.redis_streams import RedisStreamsConfig

          def forbidden(*args, **kwargs):
              raise AssertionError("factory construction must not acquire resources")

          def test_all_factories_are_lazy(kafka_transport_factory, rabbitmq_transport_factory,
                                         redis_streams_transport_factory, sync_observer_factory,
                                         async_observer_factory, monkeypatch):
              monkeypatch.setattr(threading.Thread, "start", forbidden)
              monkeypatch.setattr(socket.socket, "connect", forbidden)
              monkeypatch.setattr(asyncio, "new_event_loop", forbidden)
              monkeypatch.setattr(asyncio, "run", forbidden)
              monkeypatch.setattr(asyncio, "Runner", forbidden)
              for factory, config in (
                  (kafka_transport_factory, KafkaConfig(bootstrap_servers="localhost:9092")),
                  (rabbitmq_transport_factory, RabbitMQConfig(url="amqp://localhost/")),
                  (redis_streams_transport_factory, RedisStreamsConfig(url="redis://localhost/0")),
              ):
                  adapter = factory(config)
                  sync_observer_factory(transport=adapter).watch(source="events")
                  async_observer_factory(transport=adapter).watch(source="events")
              for name in ("pytest_asyncio", "confluent_kafka", "aio_pika", "aiormq", "pika", "redis", "google", "allure"):
                  assert name not in sys.modules
                  assert importlib.util.find_spec(name) is None

          @pytest.fixture(scope="session")
          def transport():
              return FakeTransport()

          @pytest.fixture(scope="session")
          def events(sync_observer_factory, transport):
              return sync_observer_factory(transport=transport)

          def test_sync_observer(events, transport, monkeypatch):
              monkeypatch.setattr(asyncio, "new_event_loop", forbidden)
              monkeypatch.setattr(asyncio, "run", forbidden)
              monkeypatch.setattr(asyncio, "Runner", forbidden)
              with events.watch(source="events") as watcher:
                  transport.publish(b"hello")
                  assert watcher.wait_for(lambda payload: payload == b"hello", timeout=1) == b"hello"
              assert transport.open_count == transport.close_count == 1
          PY
          /tmp/observer-wheel/bin/python -I -m pytest -p no:cacheprovider -c /dev/null /tmp/test_observer_minimal.py -q

      - name: Calculate release checksums
        run: sha256sum dist/* > SHA256SUMS
      - name: Upload verified release distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: Compatibility / ${{ matrix.runner.id }} / Python ${{ matrix.python }} / ${{ matrix.profile }}
    needs: packaging
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        runner:
          - {id: linux-x64, os: ubuntu-24.04, platform: linux, architecture: x64}
          - {id: macos-arm64, os: macos-15, platform: macos, architecture: arm64}
          - {id: windows-x64, os: windows-2025, platform: windows, architecture: x64}
        python: ["3.11", "3.12", "3.13", "3.14"]
        profile: [minimum, current]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.runner.architecture }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-distributions
          path: candidate-artifacts
      - name: Install isolated compatibility tooling
        run: python -m pip install "uv==${{ env.UV_VERSION }}" "pyright==1.1.414"
      - name: Verify installed packages and dependency profile
        run: >-
          python tools/run_compatibility.py
          --profile "${{ matrix.profile }}"
          --expected-python "${{ matrix.python }}"
          --expected-platform "${{ matrix.runner.platform }}"
          --expected-architecture "${{ matrix.runner.architecture }}"
          --artifacts candidate-artifacts --output artifacts/compatibility
      - name: Upload exact versions, JUnit, and first-failure evidence
        if: ${{ !cancelled() && (success() || failure()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-${{ matrix.runner.id }}-python-${{ matrix.python }}-${{ matrix.profile }}
          path: artifacts/compatibility/
          if-no-files-found: error
          retention-days: 7

  kafka:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAFKA_PORT: "9092"
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --all-groups --all-extras
      - name: Start Kafka
        run: docker compose up --detach --wait --wait-timeout 120
      - run: uv run pytest -c pyproject.toml tests/integration/test_kafka*.py tests/integration/test_sync_contracts.py examples/pytest/test_kafka.py -v --junitxml=kafka-results.xml -o junit_family=xunit1
      - name: Run Kafka Allure examples
        id: kafka_allure_tests
        run: uv run pytest -c pyproject.toml examples/allure/test_kafka.py -m integration --alluredir=artifacts/allure-kafka-results --clean-alluredir -v
      - name: Generate standalone Kafka Allure report
        id: generate_kafka_report
        if: ${{ !cancelled() && (steps.kafka_allure_tests.outcome == 'success' || steps.kafka_allure_tests.outcome == 'failure') }}
        run: npx --yes allure@3.22.1 awesome artifacts/allure-kafka-results --single-file --output artifacts/allure-kafka-report --report-language en
      - name: Upload Kafka Allure report
        if: ${{ !cancelled() && (steps.generate_kafka_report.outcome == 'success' || steps.generate_kafka_report.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-kafka-example-report
          path: artifacts/allure-kafka-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Kafka logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 kafka
      - name: Stop Kafka
        if: always()
        run: docker compose down --volumes

  rabbitmq:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RABBITMQ_URL: amqp://observer:observer@127.0.0.1:5672/
      RABBITMQ_MANAGEMENT_URL: http://127.0.0.1:15672
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --all-groups --all-extras
      - name: Start RabbitMQ
        run: docker compose --profile rabbitmq up --detach --wait --wait-timeout 120 rabbitmq
      - name: Run RabbitMQ contracts and pytest examples
        run: uv run pytest -c pyproject.toml tests/integration/test_rabbitmq*.py tests/integration/test_sync_contracts.py examples/pytest/test_rabbitmq.py -v --junitxml=rabbitmq-results.xml -o junit_family=xunit1
      - name: Run RabbitMQ Allure examples
        id: rabbitmq_allure_tests
        run: uv run pytest -c pyproject.toml examples/allure/test_rabbitmq.py -m integration --alluredir=artifacts/allure-rabbitmq-results --clean-alluredir -v
      - name: Generate standalone RabbitMQ Allure report
        id: generate_rabbitmq_report
        if: ${{ !cancelled() && (steps.rabbitmq_allure_tests.outcome == 'success' || steps.rabbitmq_allure_tests.outcome == 'failure') }}
        run: npx --yes allure@3.22.1 awesome artifacts/allure-rabbitmq-results --single-file --output artifacts/allure-rabbitmq-report --report-language en
      - name: Upload RabbitMQ Allure report
        if: ${{ !cancelled() && (steps.generate_rabbitmq_report.outcome == 'success' || steps.generate_rabbitmq_report.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-rabbitmq-example-report
          path: artifacts/allure-rabbitmq-report/
          if-no-files-found: warn
          retention-days: 7
      - name: RabbitMQ logs on failure
        if: failure()
        run: docker compose --profile rabbitmq logs --no-color --tail 200 rabbitmq
      - name: Stop RabbitMQ
        if: always()
        run: docker compose --profile rabbitmq down --volumes

  redis-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDIS_URL: redis://:observer@127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --all-groups --all-extras
      - name: Start Redis Streams
        run: docker compose --profile redis up --detach --wait --wait-timeout 120 redis
      - name: Run Redis Streams contracts and pytest examples
        run: uv run pytest -c pyproject.toml tests/integration/test_redis_streams*.py tests/integration/test_sync_contracts.py examples/pytest/test_redis_streams.py -v --junitxml=redis-results.xml -o junit_family=xunit1
      - name: Run Redis Streams Allure examples
        id: redis_allure_tests
        run: uv run pytest -c pyproject.toml examples/allure/test_redis_streams.py -m integration --alluredir=artifacts/allure-redis-results --clean-alluredir -v
      - name: Generate standalone Redis Streams Allure report
        id: generate_redis_report
        if: ${{ !cancelled() && (steps.redis_allure_tests.outcome == 'success' || steps.redis_allure_tests.outcome == 'failure') }}
        run: npx --yes allure@3.22.1 awesome artifacts/allure-redis-results --single-file --output artifacts/allure-redis-report --report-language en
      - name: Upload Redis Streams Allure report
        if: ${{ !cancelled() && (steps.generate_redis_report.outcome == 'success' || steps.generate_redis_report.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-redis-example-report
          path: artifacts/allure-redis-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Redis Streams logs on failure
        if: failure()
        run: docker compose --profile redis logs --no-color --tail 200 redis
      - name: Stop Redis Streams
        if: always()
        run: docker compose --profile redis down --volumes

  release-gates:
    name: Evaluate release gates
    if: ${{ always() && !cancelled() }}
    needs: [core, quality, packaging, compatibility, kafka, rabbitmq, redis-streams, allure-example]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - name: Download candidate distributions
        if: needs.packaging.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-distributions
          path: candidate-artifacts
      - name: Download producer evidence from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: release-gate-evidence-*
          path: gate-inputs
      - name: Record GitHub job results
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          jobs = json.loads(os.environ["JOB_RESULTS"])
          Path("job-results.json").write_text(json.dumps({
              name: {"result": value["result"]} for name, value in jobs.items()
          }))
          PY
      - name: Audit open release gates on non-release runs
        if: github.event_name != 'release'
        run: >-
          python tools/check_release_gates.py --mode audit
          --evidence-dir gate-inputs --dist-dir candidate-artifacts/dist
          --job-results job-results.json --report artifacts/release-gates/report.json
      - name: Enforce every gate and assemble the publication bundle
        if: github.event_name == 'release'
        run: >-
          python tools/check_release_gates.py
          --evidence-dir gate-inputs --dist-dir candidate-artifacts/dist
          --job-results job-results.json --report artifacts/release-gates/report.json
          --bundle-dir approved-release
      - name: Upload release gate report
        if: ${{ !cancelled() && (success() || failure()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gates-report
          path: artifacts/release-gates/
          if-no-files-found: error
          retention-days: 7
      - name: Upload the authorized publication bundle
        if: github.event_name == 'release' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: approved-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release to PyPI
    if: github.event_name == 'release'
    needs: [core, quality, packaging, compatibility, kafka, rabbitmq, redis-streams, allure-example, release-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-broker-observer/
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: verified-release
          path: release-artifacts
      - name: Verify distribution checksums
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS
      - name: Publish distributions to PyPI with attestations
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: release-artifacts/dist/
          attestations: true
